<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hola amor</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    position: relative;
    background: linear-gradient(180deg, #ffd6e8 0%, #ffb6d9 40%, #ff8fc7 100%);
  }

  /* Nubes */
  .cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 50px;
    filter: blur(0.5px);
  }

  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 50%;
  }

  .cloud1 {
    width: 140px;
    height: 45px;
    top: 10%;
    animation: moveCloud 28s linear infinite;
  }
  .cloud1::before { width: 70px; height: 70px; top: -35px; left: 15px; }
  .cloud1::after { width: 55px; height: 55px; top: -25px; left: 70px; }

  .cloud2 {
    width: 100px;
    height: 35px;
    top: 25%;
    animation: moveCloud 36s linear infinite;
    animation-delay: -10s;
  }
  .cloud2::before { width: 50px; height: 50px; top: -25px; left: 10px; }
  .cloud2::after { width: 40px; height: 40px; top: -18px; left: 50px; }

  .cloud3 {
    width: 160px;
    height: 50px;
    top: 65%;
    animation: moveCloud 42s linear infinite;
    animation-delay: -20s;
  }
  .cloud3::before { width: 80px; height: 80px; top: -40px; left: 20px; }
  .cloud3::after { width: 60px; height: 60px; top: -28px; left: 85px; }

  .cloud4 {
    width: 110px;
    height: 38px;
    top: 80%;
    animation: moveCloud 32s linear infinite;
    animation-delay: -5s;
  }
  .cloud4::before { width: 55px; height: 55px; top: -28px; left: 12px; }
  .cloud4::after { width: 42px; height: 42px; top: -20px; left: 55px; }

  @keyframes moveCloud {
    from { left: -200px; }
    to { left: 110%; }
  }

  /* Flores girando */
  .flower {
    position: absolute;
    font-size: 40px;
    animation: spin 6s linear infinite, float 8s ease-in-out infinite;
    user-select: none;
    opacity: 0.9;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
  }

  .f1 { top: 8%;  left: 6%;  font-size: 36px; animation-duration: 5.5s, 7s; }
  .f2 { top: 18%; left: 88%; font-size: 44px; animation-duration: 6.5s, 9s; }
  .f3 { top: 40%; left: 3%;  font-size: 30px; animation-duration: 5s, 6s; }
  .f4 { top: 55%; left: 92%; font-size: 38px; animation-duration: 7s, 8s; }
  .f5 { top: 75%; left: 10%; font-size: 42px; animation-duration: 6s, 7.5s; }
  .f6 { top: 85%; left: 80%; font-size: 34px; animation-duration: 5.8s, 6.8s; }
  .f7 { top: 12%; left: 45%; font-size: 28px; animation-duration: 6.2s, 9.5s; }
  .f8 { top: 68%; left: 50%; font-size: 30px; animation-duration: 5.3s, 7.2s; }

  /* Contenedor de mensajes */
  .card {
    position: relative;
    z-index: 10;
    max-width: 480px;
    margin: 0 auto;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.85);
    border-radius: 24px;
    padding: 45px 35px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(255, 105, 180, 0.35);
    backdrop-filter: blur(6px);
    border: 2px solid rgba(255, 182, 217, 0.8);
  }

  .message {
    display: none;
    animation: fadeIn 0.6s ease forwards;
  }

  .message.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  .heart-icon {
    font-size: 48px;
    margin-bottom: 15px;
    display: inline-block;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  h1 {
    color: #d6336c;
    font-size: 2.1em;
    margin-bottom: 20px;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
  }

  p {
    color: #a3336c;
    font-size: 1.15em;
    line-height: 1.6;
    margin-bottom: 25px;
  }

  button {
    background: linear-gradient(135deg, #ff6fa5, #ff4d8d);
    color: white;
    border: none;
    padding: 14px 38px;
    font-size: 1.05em;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 8px 20px rgba(255, 77, 141, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  button:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 12px 26px rgba(255, 77, 141, 0.5);
  }

  button:active {
    transform: translateY(0) scale(0.98);
  }

  .final-emojis {
    font-size: 1.4em;
    margin-top: 5px;
  }
</style>
</head>
<body>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <div class="cloud cloud4"></div>

  <div class="flower f1">🌸</div>
  <div class="flower f2">🌷</div>
  <div class="flower f3">🌺</div>
  <div class="flower f4">🌸</div>
  <div class="flower f5">🌷</div>
  <div class="flower f6">💮</div>
  <div class="flower f7">🌺</div>
  <div class="flower f8">🌸</div>

  <div class="card">

    <div class="message active" id="msg1">
      <div class="heart-icon">💗</div>
      <h1>Hola amor</h1>
      <button onclick="showMessage(2)">Continuar</button>
    </div>

    <div class="message" id="msg2">
      <div class="heart-icon">💕</div>
      <p>Esta página es para recordarte que te quiero mucho y que debes de almorzar a tu hora.</p>
      <button onclick="showMessage(3)">Continuar</button>
    </div>

    <div class="message" id="msg3">
      <div class="heart-icon">🥺</div>
      <p>Ponme en tu perfil de IG plis <span class="final-emojis">:)) :(</span></p>
    </div>

  </div>

  <script>
    function showMessage(num) {
      document.querySelectorAll('.message').forEach(m => m.classList.remove('active'));
      document.getElementById('msg' + num).classList.add('active');
    }
  </script>

</body>
</html>
